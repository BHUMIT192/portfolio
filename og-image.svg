<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="50%" stop-color="#0A0E16"/>
      <stop offset="100%" stop-color="#0F1521"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.035)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="250" y1="0" x2="250" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="550" y1="0" x2="550" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="850" y1="0" x2="850" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Glowing Radial Orbs -->
  <circle cx="950" cy="180" r="220" fill="url(#glowGrad)" filter="url(#glow)"/>
  <circle cx="200" cy="500" r="180" fill="rgba(139,92,246,0.12)" filter="url(#glow)"/>

  <!-- Card Border Container -->
  <rect x="50" y="50" width="1100" height="530" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top Badge: Location & Status -->
  <rect x="90" y="96" width="190" height="38" rx="19" fill="rgba(34,211,238,0.08)" stroke="rgba(34,211,238,0.3)" stroke-width="1"/>
  <circle cx="112" cy="115" r="5" fill="#34D399"/>
  <text x="128" y="120" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#22D3EE" letter-spacing="1.5">MUMBAI, INDIA</text>

  <!-- Main Name Title -->
  <text x="90" y="215" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="64" font-weight="800" fill="#EDF1F7" letter-spacing="-1">
    Bhumit <tspan fill="url(#accentGrad)">Bagdiya</tspan>
  </text>

  <!-- Tagline / Role -->
  <text x="90" y="275" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="500" fill="#94A0B4">
    B.Sc. FinTech Student <tspan fill="#3B82F6">•</tspan> Finance Enthusiast <tspan fill="#3B82F6">•</tspan> Trader <tspan fill="#3B82F6">•</tspan> Entrepreneur
  </text>

  <!-- Decorative Abstract Candlestick & Wave Graphic (Right Side) -->
  <g transform="translate(720, 190)">
    <!-- Candlesticks -->
    <rect x="0" y="60" width="14" height="70" fill="#34D399" rx="3"/>
    <line x1="7" y1="40" x2="7" y2="150" stroke="#34D399" stroke-width="2"/>

    <rect x="40" y="40" width="14" height="90" fill="#34D399" rx="3"/>
    <line x1="47" y1="20" x2="47" y2="155" stroke="#34D399" stroke-width="2"/>

    <rect x="80" y="75" width="14" height="45" fill="#F43F5E" rx="3"/>
    <line x1="87" y1="60" x2="87" y2="135" stroke="#F43F5E" stroke-width="2"/>

    <rect x="120" y="30" width="14" height="110" fill="#34D399" rx="3"/>
    <line x1="127" y1="10" x2="127" y2="160" stroke="#34D399" stroke-width="2"/>

    <rect x="160" y="80" width="14" height="50" fill="#F43F5E" rx="3"/>
    <line x1="167" y1="65" x2="167" y2="145" stroke="#F43F5E" stroke-width="2"/>

    <rect x="200" y="20" width="14" height="120" fill="#34D399" rx="3"/>
    <line x1="207" y1="0" x2="207" y2="165" stroke="#34D399" stroke-width="2"/>

    <rect x="240" y="10" width="14" height="90" fill="#34D399" rx="3"/>
    <line x1="247" y1="-10" x2="247" y2="130" stroke="#34D399" stroke-width="2"/>

    <rect x="280" y="5" width="14" height="75" fill="#34D399" rx="3"/>
    <line x1="287" y1="-15" x2="287" y2="110" stroke="#34D399" stroke-width="2"/>

    <!-- Dynamic Trendline -->
    <path d="M 0 110 Q 70 80 140 60 T 280 15" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(90, 340)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="48" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
    <text x="24" y="30" font-family="'JetBrains Mono', monospace" font-size="14" fill="#EDF1F7">⚡ Market Simulator</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="48" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
    <text x="264" y="30" font-family="'JetBrains Mono', monospace" font-size="14" fill="#EDF1F7">💼 IBM &amp; Infosys</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="48" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
    <text x="504" y="30" font-family="'JetBrains Mono', monospace" font-size="14" fill="#EDF1F7">🎓 Sydenham College</text>
  </g>

  <!-- Bottom Brand Footer -->
  <line x1="90" y1="460" x2="1110" y2="460" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="90" y="505" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#22D3EE">
    https://bhumit192.github.io/portfolio/
  </text>
  <text x="1110" y="505" font-family="'JetBrains Mono', monospace" font-size="15" fill="#5A6478" text-anchor="end">
    Interactive FinTech Portfolio • 2026
  </text>
</svg>
